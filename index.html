<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>띵동! 보넥도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2F4BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="띵동! 보넥도">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Unbounded:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 한 손 폰 앱. 문(도어) 모양 히어로 + 최애 색으로 물드는 앱 전체 + 떠 있는 하단 탭 */
:root{
  /* 최애 색 (JS가 멤버 색으로 바꿔요) */
  --acc-l:#2F4BFF; --acc-d:#8C9BFF; --acc-ink-l:#FFFFFF;
  --acc:var(--acc-l); --acc-ink:var(--acc-ink-l);
  --bg:#F2F3FA; --surface:#FFFFFF; --surface-2:#E9EBF6; --ink:#12142B; --muted:#5D6284; --line:#DCDFEE;
  --hot:#FF2F55; --hot-ink:#FFFFFF; --gold:#FFC83D;
  --k-show:#2F7BFF; --k-live:#E5367A; --k-release:#7C4DFF; --k-event:#0E9F6E; --k-bday:#E58A00;
  --shadow:0 1px 2px rgba(18,20,43,.06),0 8px 24px rgba(18,20,43,.07);
  --acc-soft:color-mix(in srgb, var(--acc) 13%, var(--surface));
  --f-display:"Gasoek One","Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Unbounded","IBM Plex Sans KR",system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --acc:var(--acc-d); --acc-ink:#0B0C18;
    --bg:#0B0C18; --surface:#15172A; --surface-2:#1E2139; --ink:#F1F2FA; --muted:#9EA2C4; --line:#2A2D48;
    --hot:#FF5C7A; --hot-ink:#0B0C18; --gold:#FFD15C;
    --k-show:#7FB0FF; --k-live:#FF7FB0; --k-release:#B39BFF; --k-event:#4FD9A0; --k-bday:#FFC04D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --acc:var(--acc-d); --acc-ink:#0B0C18;
  --bg:#0B0C18; --surface:#15172A; --surface-2:#1E2139; --ink:#F1F2FA; --muted:#9EA2C4; --line:#2A2D48;
  --hot:#FF5C7A; --hot-ink:#0B0C18; --gold:#FFD15C;
  --k-show:#7FB0FF; --k-live:#FF7FB0; --k-release:#B39BFF; --k-event:#4FD9A0; --k-bday:#FFC04D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;
  transition:background-color .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:10px}
.d{font-family:var(--f-display);font-weight:400;letter-spacing:-.005em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h2,h3,h4{text-wrap:balance}

.wrap{max-width:560px;margin:0 auto;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

/* ---------- 상단 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px, env(safe-area-inset-left,0px))) 0;
  padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.brand{display:flex;align-items:center;gap:10px;margin:0;min-width:0}
.logo{width:36px;height:40px;flex:none;color:var(--acc)}
.brand-t{display:flex;flex-direction:column;min-width:0}
.brand-t b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.05}
.brand-t span{font-size:11.5px;color:var(--muted);font-weight:500}
.top-r{display:flex;align-items:center;gap:8px}
.upd{font-size:11px;color:var(--muted);text-align:right;line-height:1.25}
.bell{position:relative;width:42px;height:42px;border-radius:14px;border:0;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 6px 18px color-mix(in srgb, var(--acc) 35%, transparent)}
.bell svg{width:21px;height:21px}
.bell.ring svg{animation:ring .9s ease-in-out}
.bell i{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--hot);box-shadow:0 0 0 2px var(--acc)}
@keyframes ring{0%{transform:rotate(0)}15%{transform:rotate(20deg)}30%{transform:rotate(-17deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}100%{transform:rotate(0)}}

/* ---------- 공통 ---------- */
.sec{margin-top:30px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 0 12px}
.sh .eb{display:block;font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--acc);margin-bottom:3px}
.sh h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.15}
.more{flex:none;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 16px;box-shadow:var(--shadow)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 16px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:12px}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink)}
.pill.now{background:var(--hot);color:var(--hot-ink)}
.pill.today{background:color-mix(in srgb, var(--hot) 16%, var(--surface));color:var(--hot)}
.pill.soon{font-family:var(--f-num);font-size:11px;letter-spacing:-.01em}
.pill.end{background:transparent;border:1px solid var(--line);color:var(--muted)}
.empty{text-align:center;padding:34px 12px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:34px 0 0;line-height:1.7}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));
  margin:0 calc(-1 * max(16px, env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left,0px)));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;transition:background-color .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding:2px max(16px, env(safe-area-inset-right,0px)) 8px max(16px, env(safe-area-inset-left,0px));
  margin:0 calc(-1 * max(16px, env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left,0px)));scroll-padding-left:max(16px, env(safe-area-inset-left,0px))}
.rail::-webkit-scrollbar{display:none}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:2px 0 4px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--acc)}

/* ---------- 히어로 (문) ---------- */
.hero{position:relative;margin-top:6px;border-radius:200px 200px 28px 28px / 150px 150px 28px 28px;overflow:hidden;color:#fff;isolation:isolate;
  background:radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--acc-l) 70%, #fff) 0%, var(--acc-l) 42%, color-mix(in srgb, var(--acc-l) 55%, #050720) 100%);
  box-shadow:0 18px 40px color-mix(in srgb, var(--acc-l) 32%, transparent)}
.hero::before{content:"";position:absolute;inset:14px 14px 14px;border-radius:186px 186px 18px 18px / 138px 138px 18px 18px;border:1.5px solid rgba(255,255,255,.28);z-index:-1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 22px)}
.hero-in{padding:66px 26px 24px;text-align:center}
.hero .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:999px;margin:0 0 12px}
.hero .eyebrow .lv{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(255,200,61,.8);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,61,.7)}70%{box-shadow:0 0 0 8px rgba(255,200,61,0)}100%{box-shadow:0 0 0 0 rgba(255,200,61,0)}}
.hero h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px, 7.4vw, 36px);line-height:1.16;margin:0 auto 8px;max-width:15em}
.hero .sub{margin:0 auto;max-width:28em;opacity:.92;font-size:14.5px}
.cd{display:flex;justify-content:center;gap:8px;margin:20px 0 4px}
.cd div{min-width:62px;padding:10px 6px 8px;border-radius:16px;background:rgba(6,8,30,.24);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18)}
.cd b{display:block;font-family:var(--f-num);font-weight:700;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;font-weight:700;opacity:.8}
.cd-l{font-size:12.5px;opacity:.85;margin:14px 0 0}
.hero .row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.hero .btn{background:#fff;color:#12142B;border:0}
.hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.knob{position:absolute;right:22px;top:58%;width:16px;height:16px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(255,255,255,.16),inset -2px -3px 0 rgba(0,0,0,.18)}
.hero.bday{background:radial-gradient(120% 80% at 50% 0%, #FFE08A 0%, #FF8DB3 45%, #7C4DFF 100%)}

/* ---------- 최애 카드 ---------- */
.fav{position:relative;margin-top:16px;border-radius:24px;padding:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.fav::before{content:"";position:absolute;left:0;top:0;bottom:0;width:120px;background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 16%, transparent), transparent);pointer-events:none}
.fav-top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.12em;background:var(--acc);color:var(--acc-ink);padding:5px 10px;border-radius:999px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.fav-main{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px}
.fav .en{font-family:var(--f-num);font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--acc);margin:0}
.fav h3{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1;margin:4px 0 0}
.fav .sub{font-size:13px;color:var(--muted);margin:8px 0 0}
.dring{flex:none;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:conic-gradient(var(--acc) calc(var(--p,0) * 1%), var(--surface-2) 0);position:relative}
.dring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.dring div{position:relative;line-height:1.1}
.dring b{display:block;font-family:var(--f-num);font-size:17px;font-weight:700}
.dring span{font-size:10.5px;color:var(--muted);font-weight:700}
.stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats button{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:10px 4px;cursor:pointer;text-align:center}
.stats b{display:block;font-family:var(--f-num);font-size:19px;font-weight:700;line-height:1.15}
.stats span{font-size:11.5px;color:var(--muted);font-weight:700}
.fav .rail{margin-top:14px;margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}
.pickcta{display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px;border-radius:22px;border:1.5px dashed var(--line);background:var(--surface)}
.pickcta .dots{display:grid;grid-template-columns:repeat(3,14px);gap:4px;flex:none}
.pickcta .dots i{width:14px;height:14px;border-radius:5px}
.pickcta div{flex:1;min-width:0}
.pickcta b{display:block}

/* ---------- 일정 줄 ---------- */
.ev{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .date{text-align:center;line-height:1;padding-top:2px}
.ev .date b{display:block;font-family:var(--f-num);font-weight:700;font-size:22px;letter-spacing:-.03em}
.ev .date span{display:block;font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:500}
.ev .body{min-width:0}
.ev .kind{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--kc)}
.ev .kind::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--kc)}
.ev .kind .tm{color:var(--ink)}
.ev .t{font-weight:700;line-height:1.38;margin-top:2px}
.ev .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.ev .note{font-size:12.5px;color:var(--muted);margin-top:4px}
.ev .kst{font-size:12px;color:var(--acc);font-weight:700;margin-top:3px}
.ev .lks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ev .lks a{font-size:12px;font-weight:700;text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.ev.past{opacity:.55}
.ev .star{color:var(--acc);margin-left:4px}
.k-show{--kc:var(--k-show)} .k-live{--kc:var(--k-live)} .k-release{--kc:var(--k-release)} .k-event{--kc:var(--k-event)} .k-bday{--kc:var(--k-bday)}
.month{display:flex;align-items:baseline;gap:8px;margin:26px 0 10px}
.month b{font-family:var(--f-num);font-size:28px;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--acc)}
.month span{font-size:13px;color:var(--muted);font-weight:700}
.weekly{display:flex;gap:10px}
.wk{flex:none;width:236px;scroll-snap-align:start;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.wk .wd{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-family:var(--f-display);font-size:19px}
.wk b{display:block;font-size:13.5px;line-height:1.4}
.wk span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}

/* ---------- 영상 ---------- */
.vid{flex:none;width:232px;scroll-snap-align:start;text-decoration:none;display:block;min-width:0}
.vid .th{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:linear-gradient(135deg, var(--acc-soft), var(--surface-2))}
.vid img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.vid:hover img{transform:scale(1.04)}
.vid .th::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent, rgba(5,6,20,.55));pointer-events:none}
.vid .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--acc)}
.vid .ago{position:absolute;left:8px;bottom:8px;z-index:1;color:#fff;font-size:11px;font-weight:700}
.vid .new{position:absolute;right:8px;top:8px;z-index:1;background:var(--hot);color:#fff;font-family:var(--f-num);font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:7px}
.vid .short{position:absolute;left:8px;top:8px;z-index:1;background:rgba(5,6,20,.7);color:#fff;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px}
.vid .play{position:absolute;right:8px;bottom:8px;z-index:1;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.vid .vt{margin-top:8px;font-size:13px;font-weight:700;line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .vc{font-size:11.5px;color:var(--muted);margin-top:2px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.vgrid .vid{width:auto}
.player{position:fixed;inset:0;z-index:70;background:rgba(4,5,16,.94);display:flex;flex-direction:column;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}
.player .box{max-width:900px;width:100%;margin:0 auto}
.player .frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:16px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .pt{color:#fff;font-weight:700;margin:14px 2px 12px;line-height:1.4}
.player .row{display:flex;gap:8px;justify-content:space-between}
.player .btn{background:#fff;color:#12142B;border:0}

/* ---------- 기사 · 우편함 ---------- */
.news a{display:block;text-decoration:none;padding:13px 0;border-top:1px solid var(--line)}
.news a:first-child{border-top:0}
.news .nt{font-weight:700;font-size:14.5px;line-height:1.45}
.news .nm{font-size:12px;color:var(--muted);margin-top:4px}
.news .same{color:var(--acc);font-weight:700}
.letters{display:flex;gap:12px}
.letter{flex:none;width:276px;scroll-snap-align:start;position:relative;background:var(--surface);border-radius:18px;padding:22px 16px 16px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.letter::before{content:"";position:absolute;inset:0 0 auto;height:7px;background:repeating-linear-gradient(135deg,var(--hot) 0 9px,transparent 9px 18px,var(--acc) 18px 27px,transparent 27px 36px)}
.letter .pm{position:absolute;right:12px;top:18px;width:58px;height:58px;border-radius:50%;border:2px dashed var(--hot);color:var(--hot);display:grid;place-items:center;text-align:center;transform:rotate(-12deg);line-height:1}

const pad = n => String(n).padStart(2,"0");

const nextBday = b => { const y = +TODAY.slice(0,4); let s = y+b.slice(4); if (s < TODAY) s = (y+1)+b.slice(4); return s; };
const isBdayToday = b => b.slice(5) === TODAY.slice(5);
const tmKo = tm => { if (!tm) return ""; let [h,m] = tm.split(":").map(Number); const ap = h < 12 ? "오전" : "오후"; const hh = h % 12 || 12; return ap+" "+hh+"시"+(m ? " "+m+"분" : ""); };
function ago(iso){
  const t = new Date(iso); const min = Math.floor((NOW - t)/60000);
  if (min < 1) return "방금"; if (min < 60) return min+"분 전";
  const h = Math.floor(min/60); if (h < 24) return h+"시간 전";
  const d = Math.floor(h/24); return d === 1 ? "어제" : d+"일 전";
}

}

let VIDS = {latest:[], mv:[], cams:[], all:[]};
const YTID = u => { const m = String(u||"").match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : ""; };
function buildVids(){
  const seen = new Set(); const push = (arr, v) => { if (!v.id || seen.has(v.k+v.id)) return; seen.add(v.k+v.id); arr.push(v); };
  const latest = [];
  (D.videos||[]).filter(v => v.p).sort((a,b) => a.p < b.p ? 1 : -1).forEach(v => push(latest, v));
  (D.videos||[]).filter(v => !v.p).sort((a,b) => (a.rank||0) - (b.rank||0)).forEach(v => push(latest, v));
  const mv = (D.mvs||[]).map(x => ({id:x.id, t:x.song+(x.teaser ? " (티저)" : ""), ch:x.d, k:"mv", m:[], p:""}));
  const cams = [];
  (D.cams||[]).slice().sort((a,b) => (a.p||"") < (b.p||"") ? 1 : -1).forEach(v => push(cams, v));
  (D.blip||[]).forEach(b => (b.lk||[]).forEach(l => {
    const id = YTID(l.u); if (!id || !/영상/.test(l.l)) return;
    const who = MEMBERS.find(x => l.l.startsWith(x.n));
    const isStage = /직캠|캠|무대|Stage|Performance|풀캠|페이스캠|Dance/i.test(b.t);
    push(cams, {id, t:cleanTitle(b.t)+(who ? " · "+who.n : ""), ch:"블립 "+md(b.s), k:isStage ? "stage" : "show", m: who ? [who.n] : (b.m||[]), p:b.s+"T12:00"});
  }));
  cams.sort((a,b) => (a.p||"") < (b.p||"") ? 1 : -1);
  VIDS = {latest, mv, cams, all: latest.concat(mv, cams)};
}
function favVids(n){

function cdParts(at){
  let s = Math.max(0, Math.floor((at - Date.now())/1000));
  const dd = Math.floor(s/86400); s -= dd*86400; const hh = Math.floor(s/3600); s -= hh*3600; const mm = Math.floor(s/60); s -= mm*60;
  return [[dd,"일"],[hh,"시간"],[mm,"분"],[s,"초"]].map(([v,l]) => `<div><b>${pad(v)}</b><span>${l}</span></div>`).join("");
}

function viewSchedule(){
  const kinds = [["all","전체"],["show","방송·영상"],["live","공연·투어"],["release","발매"],["event","팝업·이벤트"],["bday","생일·기념일"]];
  const chips = kinds.map(([k,l]) => `<button class="chip" type="button" data-evk="${k}" aria-pressed="${state.evKind===k}">${k !== "all" ? `<span class="dot k-${k}" style="background:var(--kc)"></span>` : ""}${l}</button>`).join("");
  const all = EV.filter(e => state.evKind === "all" || e.k === state.evKind);
  const upc = all.filter(e => status(e.s,e.e).k !== "end");
  const past = state.showPast ? all.filter(e => status(e.s,e.e).k === "end").reverse() : [];
  const group = arr => { let h = "", lastM = "", n = 0;
    arr.forEach(e => {
      const m = e.s.slice(0,7);
      if (m !== lastM){
        if (lastM) h += `</div>`;
        const [yy,mm] = m.split("-");
        const cnt = arr.filter(x => x.s.slice(0,7) === m).length;
        h += `<div class="month"><b>${+mm}월</b><span>${yy !== TODAY.slice(0,4) ? yy+"년 · " : ""}${cnt}개</span></div><div class="card">`;
        lastM = m;
      }
      h += evRow(e);
    });
    return lastM ? h + `</div>` : h; };
  let html = group(upc);
  if (past.length) html += `<div class="sh" style="margin-top:34px"><div><span class="eb">PAST</span><h3>지난 일정 · 최근 순</h3></div></div>` + group(past);
  if (!upc.length && !past.length) html = `<div class="empty">이 조건에 맞는 일정이 없어요.</div>`;
  return `
  ${secHead("EVERY WEEK","매주 고정 일정")}
  <div class="rail weekly">${REG.map(r => `<div class="wk"><span class="wd">${r.wd}</span><div><b>${esc(r.t)}</b><span>${esc(r.s)}</span></div></div>`).join("")}</div>
  <div class="sec" style="margin-top:22px">
    <div class="chips" role="group" aria-label="일정 종류">${chips}</div>
    <label class="toggle"><input type="checkbox" id="past" ${state.showPast?"checked":""}> 지난 일정도 보기 (직캠·영상 다시 보기)</label>
  </div>
  ${html}
  <p class="foot">시간은 모두 한국 시간이에요. 해외 공연 날짜는 그 나라 날짜이고, 한국 시간은 강조색 글씨로 따로 적었어요.<br>방송 시간은 방송사 사정으로 바뀔 수 있어요.</p>`;
}

  const regs = ["전체","서울","부산","대구","그 외"];
  let list = live.filter(c => (state.cafeMem === "전체" || c.m.includes(state.cafeMem)) && (state.cafeReg === "전체" || region(c.a) === state.cafeReg));
  list.sort((a,b) => {
    const an = a.s <= TODAY, bn = b.s <= TODAY;
    if (an !== bn) return an ? -1 : 1;
    return an ? (a.e < b.e ? -1 : a.e > b.e ? 1 : 0) : (a.s < b.s ? -1 : a.s > b.s ? 1 : 0);
  });
  const nowN = list.filter(c => c.s <= TODAY).length;

                                : `<span>${md(c.s)} 시작</span><b>${st.txt}</b>`;
    return `<article class="cafe">

}

/* ---------- 퀴즈 ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
function mk(q, a, pool){ const wrong = shuffle(pool.filter(x => x !== a)).slice(0,3); return {q, a, o:shuffle([a, ...wrong])}; }
function buildQuiz(){
  const names = MEMBERS.map(m => m.n);
  const bds = MEMBERS.map(m => mdKo(m.b));
  const albs = ALBUMS.filter(a => a.quiz).map(a => a.n);
  const bank = [];
  MEMBERS.forEach(m => bank.push(mk(m.n+"의 생일은?", mdKo(m.b), bds)));
  MEMBERS.forEach(m => bank.push(mk("쁘넥도 ‘"+m.bb+"’는 누구 캐릭터?", m.n, names)));
  ALBUMS.filter(a => a.quiz).forEach(a => bank.push(mk("타이틀곡 ‘"+a.title+"’, 어느 앨범?", a.n, albs)));
  bank.push(mk("보넥도 팬덤 이름은?", "원도어", ["원도어","옆집이","노크단","도어맨"]));
  bank.push(mk("보넥도 데뷔일은?", "2023년 5월 30일", ["2023년 5월 30일","2023년 9월 4일","2022년 5월 30일","2024년 4월 15일"]));
  bank.push(mk("데뷔 주간마다 여는 이벤트 이름은?", "도어잔치", ["도어잔치","문잔치","노크데이","원도어데이"]));
  bank.push(mk("‘쇼! 음악중심’ MC를 맡은 멤버는?", "성호", names));
  bank.push(mk("보넥도의 첫 팬송 제목은?", "400 Years", ["400 Years","CLICHE","Boom Boom Boom","ANIMAL"]));
  bank.push(mk("첫 월드투어 이름은?", "KNOCK ON Vol.2", ["KNOCK ON Vol.2","HOME TOUR","OPEN THE DOOR","VIRAL TOUR"]));
  bank.push(mk("멤버 중 막내는?", "운학", names));
  bank.push(mk("리우와 이한은 둘 다 몇 월생?", "10월", ["10월","8월","9월","12월"]));
  bank.push(mk("보넥도가 오프닝을 부른 포켓몬 애니는?", "원더보야지", ["원더보야지","썬&문","XY","다이아몬드&펄"]));
  bank.push(mk("포켓몬 애니 오프닝곡 제목은?", "Fly Away", ["Fly Away","ANIMAL","VIRAL","Count To Love"]));
  bank.push(mk("‘원도어 생일’은 언제?", "11월 1일", ["11월 1일","5월 30일","10월 22일","12월 25일"]));
  return {qs:shuffle(bank).slice(0,10), i:0, score:0, picked:null, card:null, done:false};
}
const quizMsg = s => s >= 9 ? "완전 찐 원도어!" : s >= 6 ? "꽤 잘 아는 원도어" : "이제 시작하는 원도어";
function viewQuiz(){
  const z = state.quiz || (state.quiz = buildQuiz());
  if (z.i >= z.qs.length){
    const best = Math.max(loadBest(), z.score*10);

    if (!z.done) { z.done = true; if (z.score >= 8) setTimeout(confetti, 200); setTimeout(() => makeCard(z.score).then(u => { z.card = u; const im = document.getElementById("qcard"); if (im) { im.src = u; im.hidden = false; } }).catch(() => {}), 50); }
    return `<div class="score quiz">
      ${secHead("RESULT","내 원도어 점수")}
      <img id="qcard" alt="퀴즈 결과 카드: ${z.score*10}점, ${quizMsg(z.score)}" ${z.card ? `src="${z.card}"` : "hidden"}>
      <p style="font-size:15px;font-weight:700;margin:14px 0 2px">${z.score*10}점 · ${quizMsg(z.score)}</p>
      <p class="hint" style="margin-top:2px">최고 기록 ${best}점 · 문제는 할 때마다 바뀌어요</p>

    </div>`;
  }
  const q = z.qs[z.i];
  const opts = q.o.map((o, i) => {
    let cls = "";
    if (z.picked !== null){ if (o === q.a) cls = "ok"; else if (o === z.picked) cls = "no"; }
    return `<button class="opt ${cls}" type="button" data-ans="${esc(o)}" ${z.picked!==null?"disabled":""}><i>${"ABCD"[i]}</i>${esc(o)}</button>`;

  return `<div class="quiz">

    <div class="qhd"><span class="num">Q${z.i+1} / ${z.qs.length}</span><span>맞힌 개수 ${z.score}</span></div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    ${z.picked !== null ? `<div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <b style="color:${z.picked === q.a ? "var(--acc)" : "var(--hot)"}">${z.picked === q.a ? "정답이에요!" : "아쉬워요, 정답은 ‘"+esc(q.a)+"’"}</b>
      <button class="btn primary" type="button" data-quiz="next">${z.i+1 === z.qs.length ? "결과 보기" : "다음 문제 →"}</button></div>` : ""}
    <div style="margin-top:24px"><button class="btn sm" type="button" data-go="home">그만하기</button></div>
  </div>`;
}

/* ---------- 결과 카드 그리기 (자랑용) ---------- */
async function makeCard(score){
  const m = MEMBERS.find(x => x.n === state.fav);
  const c1 = m ? m.c1 : "#4B66FF", c2 = m ? m.c2 : "#1A237E", ci = m ? m.ci : "#FFFFFF";
  const big = "띵동! 보넥도" + quizMsg(score);
  const small = (m ? "내 최애는 "+m.n+" ★" : "나도 원도어!") + " 너도 도전해 봐! 0123456789.·";
  try { await Promise.all([document.fonts.load('92px "Gasoek One"', big), document.fonts.load('700 60px "Unbounded"', "BOYNEXTDOOR QUIZ POINTS 0123456789"),
    document.fonts.load('500 40px "IBM Plex Sans KR"', small)]); } catch(e){}
  const W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.globalAlpha = .08; x.fillStyle = ci; for (let i = 0; i < W; i += 36) x.fillRect(i, 0, 2, H); x.globalAlpha = 1;
  // 문 모양 테두리
  x.strokeStyle = ci; x.globalAlpha = .35; x.lineWidth = 4;
  x.beginPath(); x.moveTo(80, H-80); x.lineTo(80, 470); x.arc(W/2, 470, W/2-80, Math.PI, 0); x.lineTo(W-80, H-80); x.closePath(); x.stroke(); x.globalAlpha = 1;
  x.fillStyle = "#FFC83D"; x.beginPath(); x.arc(W-150, 840, 18, 0, Math.PI*2); x.fill();
  x.fillStyle = ci; x.textAlign = "center";
  x.font = '700 34px "Unbounded", sans-serif'; x.fillText("BOYNEXTDOOR QUIZ", W/2, 260);
  x.font = '400 64px "Gasoek One", sans-serif'; x.fillText("띵동! 보넥도", W/2, 350);
  x.font = '700 300px "Unbounded", sans-serif'; x.fillText(String(score*10), W/2, 720);
  x.font = '700 50px "Unbounded", sans-serif'; x.fillText("POINTS", W/2, 800);
  x.font = '400 92px "Gasoek One", sans-serif'; x.fillText(quizMsg(score), W/2, 960);
  x.font = '500 40px "IBM Plex Sans KR", sans-serif'; x.globalAlpha = .9;
  x.fillText(m ? "내 최애는 "+m.n+" ★" : "나도 원도어!", W/2, 1060);
  x.font = '500 30px "IBM Plex Sans KR", sans-serif'; x.globalAlpha = .7;
  x.fillText(TODAY.replace(/-/g, ".")+" · 너도 도전해 봐!", W/2, 1180);
  x.globalAlpha = 1;
  return cv.toDataURL("image/png");
}
async function shareCard(){
  const z = state.quiz; if (!z) return;
  if (!z.card) { try { z.card = await makeCard(z.score); } catch(e){} }
  const text = "띵동! 보넥도 퀴즈에서 "+(z.score*10)+"점 받았어 · "+quizMsg(z.score)+" 너도 해 봐!";
  try {
    if (z.card && navigator.canShare) {
      const blob = await (await fetch(z.card)).blob();
      const file = new File([blob], "bnd-quiz.png", {type:"image/png"});
      if (navigator.canShare({files:[file]})) { await navigator.share({files:[file], text}); return; }
    }
    if (navigator.share) { await navigator.share({text, url: MODE === "pwa" ? location.href.split("#")[0] : undefined}); return; }
  } catch(e) { if (e && e.name === "AbortError") return; }
  const h = document.getElementById("shareHint"); if (h) h.hidden = false;
  try { await navigator.clipboard.writeText(text); toast("자랑 문구를 복사했어요. 카드는 길게 눌러 저장하세요"); } catch(e) { toast("카드를 길게 눌러 사진으로 저장하세요"); }
}

/* ---------- 꽃가루 ---------- */
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  const x = cv.getContext("2d"); x.scale(dpr, dpr);
  const cols = MEMBERS.map(m => m.c1).concat(["#FFC83D","#FFFFFF"]);
  const ps = Array.from({length:140}, () => ({x:innerWidth/2 + (Math.random()-.5)*80, y:innerHeight*.35, vx:(Math.random()-.5)*13, vy:-Math.random()*13-4,
    w:6+Math.random()*7, h:4+Math.random()*5, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function f(t){
    x.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w/2, -p.h/2, p.w, p.h); x.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(f); else cv.remove();
  })(t0);
}

/* ---------- 렌더 ---------- */
const VIEWS = {home:viewHome, schedule:viewSchedule, video:viewVideo, cafe:viewCafe, members:viewMembers, songs:viewVideo, quiz:viewQuiz};
function render(scrollTop){
  const v = document.getElementById("view");
  if (MODE === "pwa" && !D.at) { v.innerHTML = `<div class="loading">보넥도 소식을 불러오는 중…</div>`; renderTabs(); return; }
  v.innerHTML = `<div class="${scrollTop ? "view" : ""}">${VIEWS[state.tab]()}</div>`;
  renderTabs();
  if (scrollTop) window.scrollTo(0,0);
}
function go(tab, opts){
  opts = opts || {};
  if (!VIEWS[tab]) tab = "home";
  if (tab === "quiz" && state.tab !== "quiz") state.quiz = null;
  if (opts.mem) { state.cafeMem = opts.mem; state.cafeReg = "전체"; }
  if (tab === "songs") { tab = "video"; state.vk = "album"; }
  closeSheet();
  state.tab = tab;
  if (location.hash.slice(1) !== tab) { try { history.replaceState(null, "", "#"+tab); } catch(e){} }
  render(true);
}
document.addEventListener("click", ev => {
  if (ev.target.classList && ev.target.classList.contains("scrim")) return closeSheet();
  const a = ev.target.closest("a[data-vid], a[data-plist]");
  if (a) {
    if (a.dataset.plist) { const ids = a.dataset.plist.split(","); if (openPlayer(ids[0], "보넥도 뮤비 이어 보기", ids.slice(1).join(","))) ev.preventDefault(); return; }
    if (openPlayer(a.dataset.vid, a.dataset.vt)) ev.preventDefault();
    return;
  }
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.dataset.close) return closePlayer();
  if (t.dataset.closeSheet) return closeSheet();
  if (t.dataset.pick) { closeSheet(); document.body.insertAdjacentHTML("beforeend", pickerHtml()); return; }
  if (t.dataset.memOpen) return openMember(t.dataset.memOpen);
  if (t.dataset.fav !== undefined) {
    state.fav = t.dataset.fav; saveFav(state.fav);
    const pk = document.getElementById("picker"); if (pk) pk.remove();
    closeSheet(); applyTheme();
    if (state.fav) { toast("★ "+state.fav+" 최애로 저장했어요"); confetti(); }
    if (state.quiz) state.quiz.card = null;
    return render(false);
  }
  if (t.dataset.share) return shareCard();
  if (t.dataset.vmGo) { state.vk = "cam"; state.vm = t.dataset.vmGo; return go("video"); }
  if (t.dataset.vkGo) { state.vk = t.dataset.vkGo; return go("video"); }
  if (t.dataset.vk) { state.vk = t.dataset.vk; return render(false); }
  if (t.dataset.vm) { state.vm = t.dataset.vm; return render(false); }
  if (t.id === "newsMore") { state.newsAll = !state.newsAll; return render(false); }
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.go) return go(t.dataset.go, {mem:t.dataset.mem});
  if (t.dataset.evk) { state.evKind = t.dataset.evk; return render(false); }
  if (t.dataset.cm) { state.cafeMem = t.dataset.cm; return render(false); }
  if (t.dataset.cr) { state.cafeReg = t.dataset.cr; return render(false); }
  if (t.dataset.ans !== undefined && state.quiz && state.quiz.picked === null){
    const z = state.quiz, q = z.qs[z.i];
    z.picked = t.dataset.ans;
    if (z.picked === q.a) z.score++;
    return render(false);
  }
  if (t.dataset.quiz === "next") { state.quiz.i++; state.quiz.picked = null; return render(false); }
  if (t.dataset.quiz === "again") { state.quiz = buildQuiz(); return render(true); }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "past") { state.showPast = ev.target.checked; render(false); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closePlayer(); closeSheet(); const pk = document.getElementById("picker"); if (pk) pk.remove(); } });
document.addEventListener("pointermove", e => {
  const pc = e.target.closest && e.target.closest(".pc"); if (!pc) return;
  const r = pc.getBoundingClientRect(); pc.style.setProperty("--mx", Math.round((e.clientX - r.left) / r.width * 100));
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== state.tab) go(h); });

const bell = document.getElementById("bell");
function ringBell(){ bell.classList.remove("ring"); void bell.offsetWidth; bell.classList.add("ring"); }
bell.addEventListener("click", () => {
  ringBell(); document.getElementById("bellDot").hidden = true;
  if (state.tab !== "home") go("home");
  setTimeout(() => { const mb = document.getElementById("fresh") || document.getElementById("mailbox"); if (mb) mb.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }, 50);
});
setInterval(() => { const cd = document.getElementById("cd"); if (cd) { const at = +cd.dataset.at; if (at <= Date.now()) { tick(); render(false); } else cd.innerHTML = cdParts(at); } }, 1000);

function rebuild(){ tick(); EV = buildEvents(); NEWSG = clusterNews(); buildVids(); }
function stamp(){ if (!D.at) return; const a = new Date(D.at); document.getElementById("upd").innerHTML = "업데이트<br><span class=\"num\">"+(a.getMonth()+1)+"/"+a.getDate()+" "+pad(a.getHours())+":"+pad(a.getMinutes())+"</span>"; }
function countNew(o, n){
  const had = new Set([...(o.videos||[]), ...(o.cams||[])].map(v => v.id).concat((o.news||[]).map(x => x.t)));
  return [...(n.videos||[]), ...(n.cams||[])].filter(v => !had.has(v.id)).length + (n.news||[]).filter(x => !had.has(x.t)).length;
}
async function loadData(){
  if (MODE !== "pwa") return;
  try {
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const nd = await r.json();
    if (D.at && nd.at === D.at) return;
    const first = !D.at, n = first ? 0 : countNew(D, nd);
    D = nd; rebuild(); stamp(); render(false);
    if (n > 0) { ringBell(); document.getElementById("bellDot").hidden = false; toast("띵동! 새 소식 "+n+"개 도착"); }
  } catch(e) {}
}
function splash(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const s = document.createElement("div"); s.className = "splash"; s.setAttribute("aria-hidden","true");
  s.innerHTML = `<div class="pn l"></div><div class="pn r"></div><div class="w"><b>띵동!</b><span>BOYNEXTDOOR</span></div>`;
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1600);
}
const startHash = location.hash.slice(1);
state.tab = VIEWS[startHash] ? startHash : "home";
if (state.tab === "songs") { state.tab = "video"; state.vk = "album"; }
applyTheme(); splash();
rebuild(); stamp(); render(false);
if (!state.fav) { try { if (!localStorage.getItem("bnd-picked")) { localStorage.setItem("bnd-picked","1"); setTimeout(() => document.body.insertAdjacentHTML("beforeend", pickerHtml()), 1500); } } catch(e){} }
setTimeout(ringBell, 1700);
if (MEMBERS.some(m => isBdayToday(m.b))) setTimeout(confetti, 1600);
if (MODE === "pwa") {
  loadData();
  setInterval(loadData, 3*60*1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadData(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
